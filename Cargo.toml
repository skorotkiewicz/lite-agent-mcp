[package]
name = "llm-helper"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
scraper = "0.22"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2.5"
chrono = "0.4"
base64 = "0.22"
html2text = "0.13"
clap = { version = "4.0", features = ["derive"] }
regex = "1.10"
urlencoding = "2.1"

[[bin]]
name = "llm-helper"
path = "src/main.rs"
